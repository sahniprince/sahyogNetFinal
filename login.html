<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to SahyogNET — Demo Login</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth">

<div class="auth-wrap">
  <div class="auth-card">
    <a class="brand brand-center" href="index.html">
      <span class="logo-mark">स</span>
      <span class="brand-text">Sahyog<strong>NET</strong></span>
    </a>
    <h1 class="auth-title">Welcome to SahyogNET</h1>
    <p class="auth-sub">Select a role. No authentication required.</p>

    <div class="role-grid" id="roleGrid">
      <button class="role-card" data-role="customer">
        <span class="role-ic ic-blue">👤</span>
        <span class="role-name">Continue as Customer</span>
        <span class="role-desc">Find verified workers, book services, track and rate</span>
      </button>
      <button class="role-card" data-role="worker">
        <span class="role-ic ic-green">🔧</span>
        <span class="role-name">Continue as Worker</span>
        <span class="role-desc">Receive requests, manage jobs and earnings</span>
      </button>
      <button class="role-card" data-role="admin">
        <span class="role-ic ic-amber">🏢</span>
        <span class="role-name">Continue as Cooperative Admin</span>
        <span class="role-desc">Verify workers, monitor demand and complaints</span>
      </button>
      <button class="role-card" data-role="federation">
        <span class="role-ic ic-purple">🌐</span>
        <span class="role-name">Continue as Federation Admin</span>
        <span class="role-desc">Compare cooperatives, analyse skill gaps and training</span>
      </button>
    </div>

    <div class="auth-foot">
      <span class="proto-chip">Prototype / Demo Mode</span>
      <button class="btn btn-ghost btn-sm" id="resetBtn">Reset Sample data</button>
      <a class="btn btn-ghost btn-sm" href="index.html">← Back to Home</a>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  SN.load();

  var HOME = {
    customer: 'customer/dashboard.html',
    worker: 'worker/dashboard.html',
    admin: 'admin/dashboard.html',
    federation: 'federation/dashboard.html'
  };

  document.getElementById('roleGrid').addEventListener('click', function (e) {
    var btn = e.target.closest('.role-card');
    if (!btn) return;
    var role = btn.dataset.role;
    SN.state.role = role;
    SN.save();
    location.href = HOME[role];
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    SN.reset();
    SN.toast('Demo data has been reset.', 'success');
  });
});
</script>
</body>
</html>
